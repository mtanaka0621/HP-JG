<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <!-- Dark background -->
  <rect width="1920" height="1200" fill="#0a0a0c"/>

  <!-- Parallel lines from upper-right to lower-left (angle ~-30deg, slope ~ -0.577).
       All lines share the SAME slope (= true parallel), but spacing is uneven.
       Line equation: y = -0.5774*x + c, drawn extended beyond viewbox so it tiles. -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" fill="none">
    <!-- Each line: from (x1, -200) to (x2, 1400). Slope -0.5774 (-30deg).
         x at y=-200 = (c - (-200)) / 0.5774  ... simplified: we pick c values unevenly. -->
    <line x1="-300"  y1="-100" x2="2200" y2="1343"/>
    <line x1="-180"  y1="-100" x2="2320" y2="1343"/>
    <line x1="-50"   y1="-100" x2="2450" y2="1343"/>
    <line x1="120"   y1="-100" x2="2620" y2="1343"/>
    <line x1="190"   y1="-100" x2="2690" y2="1343"/>
    <line x1="340"   y1="-100" x2="2840" y2="1343"/>
    <line x1="470"   y1="-100" x2="2970" y2="1343"/>
    <line x1="610"   y1="-100" x2="3110" y2="1343"/>
    <line x1="680"   y1="-100" x2="3180" y2="1343"/>
    <line x1="830"   y1="-100" x2="3330" y2="1343"/>
    <line x1="970"   y1="-100" x2="3470" y2="1343"/>
    <line x1="1040"  y1="-100" x2="3540" y2="1343"/>
    <line x1="1180"  y1="-100" x2="3680" y2="1343"/>
    <line x1="1330"  y1="-100" x2="3830" y2="1343"/>
    <line x1="1420"  y1="-100" x2="3920" y2="1343"/>
    <line x1="1560"  y1="-100" x2="4060" y2="1343"/>
    <line x1="1700"  y1="-100" x2="4200" y2="1343"/>
    <line x1="1820"  y1="-100" x2="4320" y2="1343"/>
    <line x1="1960"  y1="-100" x2="4460" y2="1343"/>
    <line x1="-450"  y1="-100" x2="2050" y2="1343"/>
    <line x1="-380"  y1="-100" x2="2120" y2="1343"/>
    <line x1="-110"  y1="-100" x2="2390" y2="1343"/>
    <line x1="60"    y1="-100" x2="2560" y2="1343"/>
    <line x1="270"   y1="-100" x2="2770" y2="1343"/>
    <line x1="405"   y1="-100" x2="2905" y2="1343"/>
    <line x1="540"   y1="-100" x2="3040" y2="1343"/>
    <line x1="750"   y1="-100" x2="3250" y2="1343"/>
    <line x1="900"   y1="-100" x2="3400" y2="1343"/>
    <line x1="1110"  y1="-100" x2="3610" y2="1343"/>
    <line x1="1250"  y1="-100" x2="3750" y2="1343"/>
    <line x1="1490"  y1="-100" x2="3990" y2="1343"/>
    <line x1="1630"  y1="-100" x2="4130" y2="1343"/>
    <line x1="1760"  y1="-100" x2="4260" y2="1343"/>
    <line x1="1880"  y1="-100" x2="4380" y2="1343"/>
  </g>

  <!-- Random crossing lines (various angles & positions) -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.30" fill="none">
    <line x1="0"    y1="80"    x2="1920" y2="420"/>
    <line x1="200"  y1="0"     x2="980"  y2="1200"/>
    <line x1="430"  y1="0"     x2="1450" y2="1200"/>
    <line x1="0"    y1="600"   x2="1920" y2="220"/>
    <line x1="0"    y1="980"   x2="1700" y2="700"/>
    <line x1="280"  y1="0"     x2="1100" y2="1200"/>
    <line x1="120"  y1="1200"  x2="1820" y2="60"/>
    <line x1="600"  y1="0"     x2="1380" y2="1200"/>
    <line x1="900"  y1="0"     x2="1640" y2="1200"/>
    <line x1="0"    y1="350"   x2="1500" y2="1200"/>
    <line x1="380"  y1="1200"  x2="1920" y2="180"/>
    <line x1="0"    y1="200"   x2="1100" y2="1200"/>
    <line x1="700"  y1="1200"  x2="1920" y2="540"/>
    <line x1="240"  y1="660"   x2="1700" y2="1180"/>
    <line x1="0"    y1="820"   x2="1280" y2="1200"/>
    <line x1="160"  y1="0"     x2="640"  y2="1200"/>
    <line x1="1020" y1="0"     x2="1920" y2="980"/>
