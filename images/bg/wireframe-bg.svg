    <line x1="380"  y1="0"     x2="100"  y2="1200"/>
    <line x1="1500" y1="0"     x2="780"  y2="1200"/>
    <line x1="780"  y1="0"     x2="20"   y2="1200"/>
    <line x1="0"    y1="540"   x2="1920" y2="640"/>
    <line x1="0"    y1="40"    x2="1500" y2="380"/>
    <line x1="540"  y1="280"   x2="1820" y2="900"/>
    <line x1="100"  y1="940"   x2="1640" y2="40"/>
    <line x1="220"  y1="1200"  x2="1340" y2="0"/>
    <line x1="860"  y1="1200"  x2="1920" y2="220"/>
    <line x1="0"    y1="720"   x2="900"  y2="0"/>
    <line x1="1080" y1="1200"  x2="1920" y2="460"/>
  </g>

  <!-- A few short polygonal fragments to evoke the 3D-cube wireframe feel -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.22" fill="none">
    <polyline points="320,260 420,300 420,400 320,360 320,260 320,360 240,400 240,300 320,260"/>
    <polyline points="240,300 340,340 420,300"/>
    <polyline points="340,340 340,440 420,400"/>
    <polyline points="340,440 240,400"/>

    <polyline points="1480,220 1580,260 1580,360 1480,320 1480,220 1480,320 1400,360 1400,260 1480,220"/>
    <polyline points="1400,260 1500,300 1580,260"/>
    <polyline points="1500,300 1500,400 1580,360"/>
    <polyline points="1500,400 1400,360"/>

    <polyline points="780,820 900,870 900,990 780,940 780,820 780,940 680,990 680,870 780,820"/>
    <polyline points="680,870 800,920 900,870"/>
    <polyline points="800,920 800,1040 900,990"/>
    <polyline points="800,1040 680,990"/>

    <polyline points="1620,820 1740,870 1740,990 1620,940 1620,820 1620,940 1520,990 1520,870 1620,820"/>
    <polyline points="120,650 240,700 240,820 120,770 120,650 120,770 20,820 20,700 120,650"/>
  </g>
</svg>
